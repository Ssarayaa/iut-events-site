# Connexion a la base de donnees MariaDB locale utilisee par Spring Boot.
spring.datasource.url=jdbc:mariadb://localhost:3306/iuteventssite
spring.datasource.username=root
spring.datasource.password=

# Configuration JPA/Hibernate : gestion des tables et affichage des requetes SQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
